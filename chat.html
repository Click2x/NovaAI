<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Nova - Chat</title>
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://localhost:* ws://127.0.0.1:*" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: #f5f3ff; }
      #frame { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden;
        background: rgba(24, 21, 38, .97); border: 1px solid rgba(167, 139, 250, .55); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
      #head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: grab; user-select: none; border-bottom: 1px solid rgba(167, 139, 250, .25); }
      #head .title { flex: 1; font-weight: 600; }
      #head button, .more { border: 1px solid rgba(167, 139, 250, .5); background: transparent; color: #c4b5fd; border-radius: 999px; padding: 2px 10px; cursor: pointer; font: inherit; font-size: 12px; }
      #head button:hover, .more:hover { background: rgba(76, 29, 149, .6); }
      #list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; user-select: text; }
      .msg { max-width: 88%; padding: 6px 10px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; background: rgba(55, 48, 85, .85); align-self: flex-start; }
      .msg.user { align-self: flex-end; background: rgba(91, 33, 182, .65); }
      .msg.note { align-self: center; background: transparent; color: #fca5a5; font-size: 12px; }
      .msg.pending { opacity: .7; }
      .more { align-self: center; flex: none; }
      #status { min-height: 16px; padding: 0 12px; font-size: 12px; color: #fbbf24; }
      #field { box-sizing: border-box; margin: 0 10px 10px; padding: 9px 12px; border-radius: 12px; outline: none; border: 1px solid rgba(167, 139, 250, .7);
        background: rgba(30, 27, 46, .95); color: #f5f3ff; font: inherit; }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="head"><span class="title">Nova</span><button id="avatar" title="Show or hide the avatar">Hide avatar</button><button id="close" title="Close the chat window">&times;</button></div>
      <div id="list"></div>
      <div id="status"></div>
      <input id="field" type="text" placeholder="Message Nova..." autocomplete="off" />
    </div>
    <script type="module" src="/src/chat/chat.js"></script>
  </body>
</html>
